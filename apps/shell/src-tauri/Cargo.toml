[package]
name = "applift-shell"
version = "0.1.0"
description = "applift-ui Tauri 桌面壳"
edition = "2021"

[lib]
name = "applift_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
