<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>applift</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, "PingFang SC", sans-serif;
        color: #1f2933;
        background: #f5f7fa;
      }
      .ring {
        width: 36px;
        height: 36px;
        border: 3px solid #d6dbe1;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #52606d;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <p>正在连接 applift 服务…</p>
    <p id="err" style="color: #c0392b"></p>
    <script>
      // 兜底显示失败原因（?reason= 由壳导航时注入）；就绪后由壳自动导航回应用
      const reason = new URLSearchParams(location.search).get("reason");
      if (reason) document.getElementById("err").textContent = reason;
    </script>
  </body>
</html>
