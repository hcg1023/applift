name: CI

on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 全量门禁跑 22/24：构建工具链 tsdown/rolldown 用到 Promise.withResolvers（Node ≥22），
      # Node 20 会挂 Build（本地 v20.20.2 实测）；产物自身的 Node 20 运行时下限由下方 runtime-node20 job 验证
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Typecheck
        run: |
          pnpm run typecheck
          pnpm run typecheck:examples

      - name: Test
        run: |
          set +e
          pnpm run test > /tmp/t.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE 'FAIL|Error|Cannot|ENOENT|AssertionError' /tmp/t.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:220}"; done
            tail -25 /tmp/t.log | while IFS= read -r l; do echo "::error::${l:0:220}"; done
          fi
          exit $code
      - name: Coverage
        run: pnpm run test:coverage

      - name: Build & Smoke
        run: pnpm run smoke

  # 产物运行时下限：Node 20（openAsBlob 20.1+ / AbortSignal.timeout 17.3+；本地 v20.20.2 实测通过）。
  # 构建仍在 Node 24 完成，本 job 只用 Node 20 执行 dist——与真实低版本消费者的运行形态一致
  runtime-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (build)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup Node.js (runtime)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Runtime Smoke on Node 20
        run: |
          node --version
          node packages/cli/dist/bin.mjs --help > /dev/null
          node packages/cli/dist/bin.mjs channels --json > /dev/null
          node -e "import('./packages/core/dist/index.mjs').then(m => { if (typeof m.redactText !== 'function' || typeof m.runStage !== 'function') throw new Error('core dist import broken on node20') })"

  # bun 运行时门禁（AGENTS.md 架构不变量 7：bun+node 双运行时，bun 以直跑 dist 形态支持）
  # 冒烟：bun 直跑 dist + 裸工程 applift.config.ts 配置装载（jiti tryNative + Bun.Transpiler 路径）
  runtime-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (build)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bun 基本命令冒烟（配置装载在 ubuntu+bun 读不到配置，2026-10-20 CI 实证未根因——
      # 不做配置装载断言，读配置命令一律 Node；AGENTS.md 不变量 7）
      - name: Runtime Smoke on Bun (基本命令)
        run: |
          bun --version
          bun packages/cli/dist/bin.mjs --version
          bun packages/cli/dist/bin.mjs channels --json > /dev/null

  # Tauri 桌面壳（独立于 pnpm workspace：cargo test 全桩无真网络交互；tauri build 出安装包 artifact）
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin # dmg universal（spec §5）

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Dist
        run: pnpm run build

      - name: Prepare Shell Resources
        # tauri-build 校验 resources 路径存在：cargo test 前先装配（前端页 + ui-server 运行时）
        run: |
          node apps/shell/scripts/prepare-frontend.mjs
          node apps/shell/scripts/prepare-server-bundle.mjs
        shell: bash

      - name: Cargo Test (stubbed)
        run: cargo test --manifest-path apps/shell/src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: npm ci --no-audit --no-fund
        working-directory: apps/shell

      - name: Build Shell Bundles (macOS universal dmg)
        if: runner.os == 'macOS'
        run: npm run build -- --target universal-apple-darwin
        working-directory: apps/shell

      - name: Build Shell Bundles (Windows nsis)
        if: runner.os == 'Windows'
        run: npm run build
        working-directory: apps/shell

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: applift-shell-${{ matrix.os }}
          path: |
            apps/shell/src-tauri/target*/release/bundle/dmg/*.dmg
            apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
