name: CI

on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 全量门禁跑 22/24：构建工具链 tsdown/rolldown 用到 Promise.withResolvers（Node ≥22），
      # Node 20 会挂 Build（本地 v20.20.2 实测）；产物自身的 Node 20 运行时下限由下方 runtime-node20 job 验证
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Typecheck
        run: |
          pnpm run typecheck
          pnpm run typecheck:examples

      - name: Test
        run: |
          set +e
          pnpm run test > /tmp/t.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE 'FAIL|Error|Cannot|ENOENT|AssertionError' /tmp/t.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:220}"; done
            tail -25 /tmp/t.log | while IFS= read -r l; do echo "::error::${l:0:220}"; done
          fi
          exit $code
      - name: Coverage
        run: pnpm run test:coverage

      - name: Build & Smoke
        run: pnpm run smoke

  # 产物运行时下限：Node 20（openAsBlob 20.1+ / AbortSignal.timeout 17.3+；本地 v20.20.2 实测通过）。
  # 构建仍在 Node 24 完成，本 job 只用 Node 20 执行 dist——与真实低版本消费者的运行形态一致
  runtime-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (build)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup Node.js (runtime)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Runtime Smoke on Node 20
        run: |
          node --version
          node packages/cli/dist/bin.mjs --help > /dev/null
          node packages/cli/dist/bin.mjs channels --json > /dev/null
          node -e "import('./packages/core/dist/index.mjs').then(m => { if (typeof m.redactText !== 'function' || typeof m.runStage !== 'function') throw new Error('core dist import broken on node20') })"

  # bun 运行时门禁（AGENTS.md 架构不变量 7：bun+node 双运行时，bun 以直跑 dist 形态支持）
  # 冒烟：bun 直跑 dist + 裸工程 applift.config.ts 配置装载（jiti tryNative + Bun.Transpiler 路径）
  runtime-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (build)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Runtime Smoke on Bun (dist 直跑 + 裸工程配置)
        run: |
          bun --version 2>&1 || { echo "::error::bun --version 失败"; exit 1; }
          OUT=$(bun packages/cli/dist/bin.mjs --version 2>&1) || { echo "::error::bin --version 失败: $OUT"; exit 1; }
          OUT=$(bun packages/cli/dist/bin.mjs channels --json 2>&1) || { echo "::error::channels 失败: $(echo "$OUT" | tail -3)"; exit 1; }
          D=$(mktemp -d) && cd "$D" && git init -q .
          printf 'import { defineConfig } from "@applift/cli";\nexport default defineConfig({ android: { stores: ["huawei"] } });\n' > applift.config.ts
          OUT=$(bun "$GITHUB_WORKSPACE/packages/cli/dist/bin.mjs" doctor --cwd "$D" 2>&1)
          echo "$OUT" | grep -q huawei || { echo "::error::doctor 未读到配置，输出尾部: $(echo "$OUT" | tail -4 | tr '\n' '|')"; exit 1; }
