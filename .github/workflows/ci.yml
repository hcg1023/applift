name: CI

on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: |
          set +e
          pnpm run test > /tmp/t.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE 'FAIL|Error|Cannot|ENOENT|AssertionError' /tmp/t.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:220}"; done
            tail -25 /tmp/t.log | while IFS= read -r l; do echo "::error::${l:0:220}"; done
          fi
          exit $code

      - name: Build & Smoke
        run: pnpm run smoke
